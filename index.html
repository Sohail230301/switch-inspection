<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>TEF 021 Switch Inspection</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d5dae0;--ac:#0b5cad;--ok:#1e7a3c;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa4af;--bd:#343b44;--ac:#5aa2ee;--ok:#5cc47c;--bad:#f0877f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif;padding:12px}
main{max-width:760px;margin:auto}h1{font-size:19px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;color:var(--ac)}label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select{width:100%;padding:9px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.gaps label{text-align:center;margin:0}.gaps input{text-align:center;padding:8px 2px}
.q{border-top:1px solid var(--bd);padding:8px 0}.q small{color:var(--mu)}.q p{margin:0 0 6px;font-size:14px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.yn div{display:flex;gap:6px;align-items:center}.yn span{font-size:12px;color:var(--mu);width:38px}
.yn select{padding:7px}.yes{color:var(--bad);font-weight:600}
button{width:100%;padding:14px;font:600 16px system-ui;border:0;border-radius:10px;background:var(--ac);color:#fff;margin:4px 0 10px}
#msg{font-size:13px;text-align:center;color:var(--mu);min-height:18px}
</style></head><body><main>
<h1>Detailed Inspection of Switches</h1><div class="sub">SAR-006-200-2-064 – TEF 021 (Issue 6 – August 2021). Fill in, then download the completed Excel.</div>
<section><h2>Details</h2><div class="g">
<div><label>Location</label><input id="loc" value="Dammam Yard , ST-03"></div>
<div><label>Point number</label><input id="pt" value="03P31"></div>
<div><label>Date inspected</label><input id="dt" type="date"></div>
<div><label>ELR</label><input id="elr" value="DPL"></div>
<div><label>TID</label><input id="tid" value="1500"></div>
<div><label>Km at switch toe (km)</label><input id="km" inputmode="decimal"></div>
<div><label>… metres</label><input id="m" inputmode="decimal"></div>
<div><label>Hand</label><select id="hand"><option>Right</option><option>Left</option></select></div>
<div><label>Turnout radius</label><input id="rad" value="190"></div>
<div><label>Rail grade</label><input id="grade" value="R260"></div>
<div><label>Rail profile</label><input id="prof" value="UIC 60"></div>
<div><label>Inspection type</label><select id="itype"><option>Initial Inspection</option><option>Post Welding/ Grinding Inspection</option><option>Follow Up Inspection</option></select></div>
<div><label>High risk</label><select id="hr"><option>YES</option><option>NO</option></select></div>
<div><label>Switch lubricated</label><select id="lub"><option>YES</option><option>NO</option></select></div>
</div></section>
<section><h2>Switch rail seating gap (mm)</h2><div class="gaps" id="gaps"></div>
<label>Worst sidewear – stock rail front, within 1 m of toe (L / R)</label><div class="g"><input id="f1l" placeholder="Left e.g. 12" inputmode="decimal"><input id="f1r" placeholder="Right e.g. 15" inputmode="decimal"></div>
<label>Worst sidewear – stock rail within 2 m behind the switch rail (L / R)</label><div class="g"><input id="f2l" placeholder="Left" inputmode="decimal"><input id="f2r" placeholder="Right" inputmode="decimal"></div></section>
<div id="hz"></div>
<section><h2>Sign-off</h2><div class="g">
<div><label>Inspector name</label><input id="insp" value="SAIF UR RAHMAN"></div>
<div><label>Received / reviewed by (optional)</label><input id="rev"></div>
<div><label>Review date (optional)</label><input id="rdt" type="date"></div></div></section>
<button id="go">Download completed Excel</button><div id="msg"></div>
</main>

const $=i=>document.getElementById(i), pad=n=>String(n).padStart(2,'0');
const d0=new Date(); $('dt').value=`${d0.getFullYear()}-${pad(d0.getMonth()+1)}-${pad(d0.getDate())}`;
const fmt=v=>{if(!v)return'';const[a,b,c]=v.split('-');return`${c}/${b}/${a}`};
// gap cells: [label, cell]
const GC=[...'CDEFGHIJKL'].map((c,i)=>[`L${10-i}`,c+'8']).concat([['L Toe','M8'],['R Toe','N8']],[...'OPQRSTU'].map((c,i)=>[`R${i+1}`,c+'8']),[['R8','W8'],['R9','X8'],['R10','Y8']]);
$('gaps').innerHTML=GC.map(([l,c])=>`<div><label>${l}</label><input data-c="${c}" inputmode="decimal"></div>`).join('');
$('hz').innerHTML=HZ.map(h=>`<section><h2>${h.title}</h2><small style="color:var(--mu)">${h.sub}</small>`+h.rows.map(x=>`<div class="q"><p><small>${x.id}</small><br>${x.q}</p><div class="yn"><div><span>Left</span><select data-r="${x.r}" data-s="L"><option>No</option><option>Yes</option></select></div><div><span>Right</span><select data-r="${x.r}" data-s="R"><option>No</option><option>Yes</option></select></div></div></div>`).join('')+'</section>').join('');
document.querySelectorAll('[data-r]').forEach(s=>s.onchange=()=>s.classList.toggle('yes',s.value==='Yes'));
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
function mk(doc,ref,val,num){
  let c=doc.querySelector(`c[r="${ref}"]`);
  if(!c){const row=doc.querySelector(`row[r="${ref.replace(/\D/g,'')}"]`);c=doc.createElementNS(NS,'c');c.setAttribute('r',ref);row.appendChild(c)}
  while(c.firstChild)c.removeChild(c.firstChild);c.removeAttribute('t');
  if(val===''||val==null)return;
  if(num){const v=doc.createElementNS(NS,'v');v.textContent=val;c.appendChild(v);return}
  c.setAttribute('t','inlineStr');const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');
  t.setAttribute('xml:space','preserve');t.textContent=val;is.appendChild(t);c.appendChild(is);
}
$('go').onclick=async()=>{
  const msg=$('msg');msg.textContent='Building…';
  try{
    const zip=await JSZip.loadAsync(TPL,{base64:true});
    const xml=await zip.file('xl/worksheets/sheet1.xml').async('string');
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    const S=(r,v)=>mk(doc,r,v,false),N=(r,v)=>mk(doc,r,v,true),V=i=>$(i).value.trim(), D=fmt($('dt').value);
    S('A2','Location :- '+V('loc'));S('I2','Point Number :- '+V('pt'));S('Q2','Date Inspected :-\n'+D);
    S('A3','ELR  :- '+V('elr'));S('G3','TID :- '+V('tid'));
    S('P3',`${V('km')}  Km     ${V('m')}  m`);S('R3','High Risk (Yes/ No)       '+V('hr'));
    const rh=V('hand')==='Right';S('A4','Left Hand'+(rh?'':'  √'));S('D4','Right Hand'+(rh?'  √':''));
    S('G4','Turnout Radius  :- '+V('rad'));S('L4','Rail Grade  :- '+V('grade'));S('O4','Rail Profile  :- '+V('prof'));S('V4',V('lub'));
    const it=$('itype').selectedIndex;S('K5',it===0?'√':'');S('Q5',it===1?'√':'');S('Y5',it===2?'√':'');
    document.querySelectorAll('#gaps input').forEach(i=>{const v=i.value.trim();v===''?N(i.dataset.c,''):N(i.dataset.c,v)});
    const sw=(l,r)=>`L-${l.value.trim()} R-${r.value.trim()}`;
    S('K9',($('f1l').value||$('f1r').value)?sw($('f1l'),$('f1r')):'');S('X9',($('f2l').value||$('f2r').value)?sw($('f2l'),$('f2r')):'');
    HZ.forEach(h=>h.rows.forEach(x=>{['L','M','N','O'].forEach(c=>S(c+x.r,''));
      const l=document.querySelector(`[data-r="${x.r}"][data-s="L"]`).value==='Yes',r=document.querySelector(`[data-r="${x.r}"][data-s="R"]`).value==='Yes';
      S((l?'L':'M')+x.r,'√');S((r?'N':'O')+x.r,'√')}));
    S('A35','Inspectors Name:\n'+V('insp'));S('L35','Date:\n'+D);
    S('A36','Received/ Reviewed By (Name)'+(V('rev')?'\n'+V('rev'):''));S('L36','Date:'+($('rdt').value?'\n'+fmt($('rdt').value):''));
    zip.file('xl/worksheets/sheet1.xml',new XMLSerializer().serializeToString(doc));
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const fn=`TEF21-${V('pt')||'inspection'}.xlsx`;
    let dl=null;try{dl=await claude.use('downloads')}catch(e){}
    if(dl){await dl.save({filename:fn,data:blob})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
    msg.textContent='Done: '+fn;
  }catch(e){msg.textContent=e&&e.code==='declined'?'Download cancelled.':'Error: '+(e.message||e)}
};
</script></body></html>
